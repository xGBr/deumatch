<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Deu Match Aqui · Cardápio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --cream:#FBF3E8;
    --paper:#F1E2C6;
    --kraft:#DEC9A3;
    --cocoa:#5A3B22;
    --cocoa-dark:#2E1C10;
    --gold:#A97C2F;
    --gold-soft:#C9A15A;
    --rose:#C98B8B;
    --rose-dark:#A85F5F;
    --white:#FFFDF8;
    --line:rgba(46,28,16,0.14);
    --shadow:0 4px 16px rgba(46,28,16,0.14);
    --font-serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
    --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --maxw:480px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--kraft);font-family:var(--font-sans);color:var(--cocoa-dark);-webkit-font-smoothing:antialiased;}
  button,input,textarea{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  #root{max-width:var(--maxw);margin:0 auto;min-height:100vh;background:var(--cream);position:relative;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .boot{padding:60px 20px;text-align:center;color:var(--cocoa);font-family:var(--font-serif);font-style:italic;}

  /* Header */
  .header{position:sticky;top:0;z-index:15;background:var(--paper);padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);}
  .header img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gold-soft);flex:0 0 auto;}
  .header .brand{flex:1;min-width:0;}
  .header .brand h1{font-family:var(--font-serif);font-style:italic;font-size:20px;margin:0;color:var(--cocoa-dark);line-height:1.15;}
  .header .brand p{margin:2px 0 0;font-size:12px;color:var(--cocoa);opacity:0.75;}

  /* Categories */
  .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .cat-pill{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--gold-soft);background:var(--white);color:var(--cocoa);font-size:13px;white-space:nowrap;}
  .cat-pill.active{background:var(--cocoa-dark);border-color:var(--cocoa-dark);color:var(--cream);}

  /* Notice */
  .notice{background:#FBE7C6;border:1px solid var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:12.5px;margin:4px 0 14px;color:var(--cocoa-dark);line-height:1.4;}
  .notice button{background:none;border:none;text-decoration:underline;color:var(--cocoa-dark);font-weight:700;cursor:pointer;padding:0;font-size:inherit;}

  /* Menu / products */
  .menu{padding:2px 18px 24px;flex:1;}
  .category-title{font-family:var(--font-serif);font-size:17px;margin:20px 0 8px;color:var(--cocoa-dark);}
  .product{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
  .product img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:0 0 auto;}
  .product .ph{width:64px;height:64px;border-radius:8px;flex:0 0 auto;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:26px;}
  .product .info{flex:1;min-width:0;}
  .product .info h3{margin:0 0 4px;font-size:15px;font-weight:600;}
  .product .info p{margin:0 0 6px;font-size:12.5px;color:var(--cocoa);opacity:0.75;line-height:1.4;}
  .product .price{font-weight:700;color:var(--gold);font-size:14px;}
  .product .add-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:2px;}
  .btn-add{background:var(--rose);color:#fff;border:none;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;}
  .stepper{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:4px 8px;}
  .stepper button{width:22px;height:22px;border-radius:50%;border:none;background:var(--cocoa-dark);color:#fff;font-size:15px;line-height:1;padding:0;}
  .stepper span{min-width:14px;text-align:center;font-weight:600;font-size:13px;}

  .footer-link{text-align:center;padding:20px 10px 6px;font-size:11.5px;color:var(--cocoa);opacity:0.55;}
  .footer-link button{background:none;border:none;color:inherit;text-decoration:underline;font-size:inherit;}

  /* Cart bar */
  .cart-bar{position:sticky;bottom:0;background:var(--cocoa-dark);color:var(--cream);display:flex;justify-content:space-between;align-items:center;padding:14px 18px;box-shadow:0 -4px 14px rgba(0,0,0,0.25);z-index:16;}
  .cart-bar .count{font-size:13px;opacity:0.9;}
  .cart-bar .go{font-weight:700;font-size:14px;color:var(--gold-soft);}

  /* Overlay / sheet / modal */
  .overlay{position:fixed;inset:0;background:rgba(20,12,6,0.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  .overlay-center{align-items:center;padding:20px;}
  .sheet{background:var(--cream);width:100%;max-width:var(--maxw);max-height:88vh;border-radius:18px 18px 0 0;overflow-y:auto;padding:18px 18px 26px;}
  @media (prefers-reduced-motion:no-preference){
    .sheet{animation:slideUp .25s ease;}
    @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  }
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .sheet-header h2{font-family:var(--font-serif);margin:0;font-size:20px;}
  .close-x{background:none;border:none;font-size:18px;color:var(--cocoa);padding:4px;}
  .step-label{font-family:var(--font-serif);font-size:14px;color:var(--gold);margin:18px 0 8px;font-weight:700;}
  .sheet-note{font-size:13px;color:var(--cocoa);opacity:.8;line-height:1.4;margin:0 0 4px;}

  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px;}
  .ci-info{display:flex;flex-direction:column;font-size:13.5px;min-width:0;}
  .ci-info strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ci-info span{font-size:12px;color:var(--cocoa);opacity:.65;}

  .delivery-options{display:flex;gap:10px;margin-bottom:8px;}
  .delivery-opt{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;font-size:13px;}
  .delivery-opt.active{border-color:var(--gold);background:var(--paper);font-weight:700;}
  .fee-note{font-size:12.5px;color:var(--cocoa);opacity:.8;margin:-2px 0 12px;}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--cocoa);margin-bottom:4px;}
  .field input, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--white);color:var(--cocoa-dark);}
  .field input:focus, .field textarea:focus{border-color:var(--gold);}
  .field-hint{font-size:11px;color:var(--cocoa);opacity:.6;margin:-4px 0 10px;}

  .totals{border-top:1px dashed var(--line);margin-top:14px;padding-top:10px;font-size:14px;}
  .totals .row{display:flex;justify-content:space-between;margin-bottom:4px;}
  .totals .row.total{font-weight:800;font-size:16px;color:var(--cocoa-dark);border-top:1px solid var(--line);padding-top:8px;margin-top:6px;}

  .btn-primary{display:block;width:100%;background:var(--cocoa-dark);color:var(--cream);border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:700;margin-top:16px;text-align:center;text-decoration:none;}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-secondary{display:block;width:100%;background:transparent;border:1.5px solid var(--cocoa-dark);color:var(--cocoa-dark);padding:11px;border-radius:10px;font-weight:700;margin-top:10px;text-align:center;text-decoration:none;}
  .btn-whatsapp{display:flex;width:100%;background:#25D366;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700;font-size:15px;align-items:center;justify-content:center;gap:8px;margin-top:14px;text-decoration:none;}
  .error-msg{color:#B23B3B;font-size:12.5px;margin-top:8px;}

  .qr-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;background:var(--paper);border-radius:12px;margin-top:14px;min-height:100px;}
  .qr-box canvas, .qr-box img{background:#fff;padding:8px;border-radius:8px;}
  .pix-code{width:100%;font-size:11px;background:var(--white);border:1px dashed var(--line);border-radius:8px;padding:8px;word-break:break-all;color:var(--cocoa);max-height:64px;overflow-y:auto;margin-top:10px;}

  /* Admin */
  .admin{padding:16px 18px 60px;}
  .admin-header{margin-bottom:8px;}
  .back-link{background:none;border:none;color:var(--gold);font-size:13px;padding:0;}
  .admin-header h2{font-family:var(--font-serif);margin:6px 0 0;font-size:21px;}
  .admin-section{margin-bottom:26px;}
  .admin-section h3{font-family:var(--font-serif);font-size:16px;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .admin-product-row{border:1px solid var(--line);border-radius:10px;padding:14px 12px 6px;margin-bottom:12px;position:relative;background:var(--white);}
  .admin-product-row .remove{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--rose-dark);font-size:12px;font-weight:700;}

  /* Pin modal */
  .pin-card{background:var(--cream);border-radius:14px;padding:26px 24px;width:100%;max-width:300px;text-align:center;}
  .pin-card h3{font-family:var(--font-serif);margin:0 0 4px;font-size:19px;}
  .pin-card p{font-size:12.5px;color:var(--cocoa);opacity:.75;margin:0;}
  .pin-card input{text-align:center;font-size:20px;letter-spacing:8px;padding:10px;width:100%;border:1px solid var(--line);border-radius:8px;margin:16px 0 4px;background:var(--white);color:var(--cocoa-dark);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--cocoa-dark);color:var(--cream);padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:88%;text-align:center;}
</style>
</head>

/* ---------- Utilidades ---------- */
function fmtBRL(v){ v = Number(v); if(isNaN(v)) v = 0; return "R$ " + v.toFixed(2).replace(".", ","); }
function escapeHTML(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function attrJs(s){ var v = String(s===undefined||s===null?"":s); v = v.replace(/\\/g,"\\\\").replace(/'/g,"\\'"); v = v.replace(/"/g,"&quot;"); return v; }
function clone(x){ return JSON.parse(JSON.stringify(x)); }

/* ---------- Armazenamento persistente (compartilhado) ---------- */
async function loadJSON(key, fallback){
  if(typeof window.storage === "undefined") return clone(fallback);
  try{
    var res = await window.storage.get(key, true);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return clone(fallback);
}
async function saveJSON(key, value){
  if(typeof window.storage === "undefined") return false;
  try{
    var res = await window.storage.set(key, JSON.stringify(value), true);
    return !!res;
  }catch(e){ console.error(e); return false; }
}

/* ---------- Carrinho ---------- */
function cartItems(){
  var out = [];
  for(var id in state.cart){
    if(state.cart[id] > 0){
      var p = state.products.find(function(pp){ return pp.id === id; });
      if(p) out.push(Object.assign({}, p, {qty: state.cart[id]}));
    }
  }
  return out;
}
function cartCount(){ return cartItems().reduce(function(s,i){ return s+i.qty; }, 0); }
function cartSubtotal(){ return cartItems().reduce(function(s,i){ return s+i.price*i.qty; }, 0); }
function addToCart(id, delta){ state.cart[id] = Math.max(0, (state.cart[id]||0) + delta); render(); }

/* ---------- Categorias ---------- */
function getCategories(){
  var cats = ["Todos"];
  state.products.forEach(function(p){ if(p.category && cats.indexOf(p.category) === -1) cats.push(p.category); });
  return cats;
}
function setCategory(c){ state.activeCategory = c; render(); }
function categoryEmoji(cat){ return CATEGORY_EMOJI[cat] || "🍰"; }

/* ---------- Navegação de sacola / entrega ---------- */

function setDeliveryType(t){ state.deliveryType = t; render(); }
function newOrder(){

  state.deliveryType = "retirada"; state.sheetOpen = false;

}

/* ---------- Validação e finalização ---------- */
function validateOrder(){
  if(cartCount() === 0) return {ok:false,msg:"Sua sacola está vazia."};
  if(!state.customer.name.trim()) return {ok:false,msg:"Informe seu nome."};
  if(!state.customer.phone.trim()) return {ok:false,msg:"Informe seu telefone com DDD."};
  if(state.deliveryType === "entrega" && (!state.address.street.trim() || !state.address.neighborhood.trim())){
    return {ok:false,msg:"Preencha rua/número e bairro para entrega."};
  }
  return {ok:true};
}

  if(!v.ok){ state.checkoutError = v.msg; render(); return; }
  state.checkoutError = "";
  var items = cartItems();

  var pixPayload = "";
  if(state.settings.pixKey && state.settings.pixKey.trim()){
    try{
      pixPayload = buildPixPayload({
        pixKey: state.settings.pixKey.trim(),
        merchantName: state.settings.merchantName || state.settings.storeName || "LOJA",
        merchantCity: state.settings.merchantCity || "BRASIL",
        amount: total,
        txid: txid
      });
    }catch(e){ console.error(e); pixPayload = ""; }
  }
  state.confirmation = {
    items: items, subtotal: subtotal, deliveryFee: deliveryFee, total: total, txid: txid, pixPayload: pixPayload,
    deliveryType: state.deliveryType, address: Object.assign({}, state.address), customer: Object.assign({}, state.customer)
  };
  render();
}

/* ---------- Pix BR Code (EMV) ---------- */
function emv(id, value){ var len = String(value.length).padStart(2,"0"); return id+len+value; }
function stripAccents(s){ return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase(); }
function crc16(str){
  var crc = 0xFFFF;
  for(var i=0;i<str.length;i++){
    crc ^= (str.charCodeAt(i) << 8);
    for(var j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
  }
  return crc & 0xFFFF;
}
function buildPixPayload(opts){
  var gui = emv("00","br.gov.bcb.pix");
  var key = emv("01", opts.pixKey);
  var mai = emv("26", gui+key);
  var mcc = emv("52","0000");
  var cur = emv("53","986");
  var amt = emv("54", Number(opts.amount).toFixed(2));
  var country = emv("58","BR");
  var name = emv("59", (stripAccents(opts.merchantName).substring(0,25) || "LOJA"));
  var city = emv("60", (stripAccents(opts.merchantCity).substring(0,15) || "BRASIL"));
  var txidClean = (opts.txid||"***").replace(/[^a-zA-Z0-9]/g,"").substring(0,25) || "***";
  var addData = emv("62", emv("05", txidClean));
  var fmtField = emv("00","01");
  var payload = fmtField+mai+mcc+cur+amt+country+name+city+addData+"6304";
  var crc = crc16(payload).toString(16).toUpperCase().padStart(4,"0");
  return payload+crc;
}
function generateQR(payload){
  var box = document.getElementById("qrcode-box");
  if(!box) return;
  box.innerHTML = "";
  if(!payload){
    box.innerHTML = '<p style="font-size:12.5px;color:var(--cocoa);opacity:.75;text-align:center;margin:0;">Configure a chave Pix no Painel da loja para gerar o QR Code de pagamento.</p>';
    return;
  }
  if(window.QRCode){
    try{ new QRCode(box, {text: payload, width:190, height:190, correctLevel: QRCode.CorrectLevel.M}); }
    catch(e){ box.innerHTML = '<p style="font-size:12px;color:#B23B3B;margin:0;">Não foi possível gerar o QR Code.</p>'; }
  } else {
    box.innerHTML = '<p style="font-size:12.5px;color:var(--cocoa);opacity:.75;text-align:center;margin:0;">QR Code indisponível agora. Use o código Pix copia-e-cola abaixo.</p>';
  }
}

/* ---------- WhatsApp ---------- */
function buildWhatsAppMessage(order){
  var lines = [];
  lines.push("*Novo pedido – " + state.settings.storeName + "*");
  lines.push("");
  lines.push("Cliente: " + order.customer.name);
  lines.push("Telefone: " + order.customer.phone);
  lines.push("");
  lines.push("*Itens:*");
  order.items.forEach(function(i){ lines.push(i.qty + "x " + i.name + " — " + fmtBRL(i.price) + " = " + fmtBRL(i.price*i.qty)); });
  lines.push("");
  lines.push("*Entrega:* " + (order.deliveryType === "entrega" ? "Entrega" : "Retirada no local"));
  if(order.deliveryType === "entrega"){
    lines.push("Endereço: " + order.address.street + ", " + order.address.neighborhood + (order.address.complement ? " - " + order.address.complement : ""));
  }
  lines.push("");
  lines.push("Subtotal: " + fmtBRL(order.subtotal));
  if(order.deliveryFee > 0) lines.push("Taxa de entrega: " + fmtBRL(order.deliveryFee));
  lines.push("*Total: " + fmtBRL(order.total) + "*");
  lines.push("");
  lines.push("Pagamento via Pix ✅ (QR Code gerado no site)");
  lines.push("Código do pedido: " + order.txid);
  return lines.join("\n");
}
function whatsappUrl(order){
  var msg = buildWhatsAppMessage(order);
  var num = (state.settings.whatsappNumber||"").replace(/\D/g,"");
  return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){ return navigator.clipboard.writeText(text); }
  return new Promise(function(resolve,reject){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? resolve() : reject();
    }catch(e){ reject(e); }
  });
}
function copyPixCode(){
  var text = state.confirmation && state.confirmation.pixPayload;
  if(!text) return;
  copyToClipboard(text).then(function(){ toast("Código Pix copiado!"); }).catch(function(){ toast("Toque e segure o código para copiar manualmente."); });
}

/* ---------- Toast ---------- */
function toast(msg){
  state.toastMsg = msg; render();
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ state.toastMsg = null; render(); }, 2600);
}

/* ---------- Admin ---------- */
function openAdmin(){ state.pinModalOpen = true; state.pinInput = ""; state.pinError = ""; render(); }
function closePinModal(){ state.pinModalOpen = false; state.pinInput = ""; state.pinError = ""; render(); }
function submitPin(){
  if(state.pinInput === (state.settings.adminPin || "1234")){
    state.adminDraft = { settings: clone(state.settings), products: clone(state.products) };
    state.pinModalOpen = false; state.view = "admin"; render();
  } else {
    state.pinError = "PIN incorreto. Tente novamente."; render();
  }
}
function exitAdmin(){ state.adminDraft = null; state.view = "menu"; render(); }
function addAdminProduct(){ state.adminDraft.products.push({id:"p"+Date.now(),category:"",name:"",price:0,desc:"",img:""}); render(); }
function removeAdminProduct(i){ state.adminDraft.products.splice(i,1); render(); }
async function saveAdmin(){
  var cleaned = state.adminDraft.products.filter(function(p){ return p.name && p.name.trim(); });
  state.settings = clone(state.adminDraft.settings);
  state.products = cleaned;
  var ok1 = await saveJSON("settings", state.settings);
  var ok2 = await saveJSON("products", state.products);
  state.view = "menu"; state.adminDraft = null;
  render();
  toast((ok1 && ok2) ? "Configurações salvas com sucesso!" : "Salvo nesta sessão (armazenamento indisponível agora).");
}

/* ---------- Views ---------- */
function isDefaultConfig(){
  return state.settings.pixKey === DEFAULT_SETTINGS.pixKey || state.settings.whatsappNumber === DEFAULT_SETTINGS.whatsappNumber;
}
function headerView(){
  return '<div class="header"><img src="'+LOGO_IMG+'" alt="Logo da loja">' +
    '<div class="brand"><h1>'+escapeHTML(state.settings.storeName)+'</h1><p>'+escapeHTML(state.settings.tagline)+'</p></div></div>';
}
function categoriesView(){
  var cats = getCategories();
  return '<div class="cats">' + cats.map(function(c){
    return '<button class="cat-pill '+(c===state.activeCategory?"active":"")+'" onclick="setCategory(\''+attrJs(c)+'\')">'+escapeHTML(c)+'</button>';
  }).join("") + '</div>';
}
function productRow(p){
  var qty = state.cart[p.id] || 0;
  var media = p.img ? ('<img src="'+p.img+'" alt="'+escapeHTML(p.name)+'">') : ('<div class="ph">'+categoryEmoji(p.category)+'</div>');
  var addCol = qty > 0
    ? '<div class="stepper"><button onclick="addToCart(\''+p.id+'\',-1)">–</button><span>'+qty+'</span><button onclick="addToCart(\''+p.id+'\',1)">+</button></div>'
    : '<button class="btn-add" onclick="addToCart(\''+p.id+'\',1)">Adicionar</button>';
  return '<div class="product">'+media+'<div class="info"><h3>'+escapeHTML(p.name)+'</h3><p>'+escapeHTML(p.desc||"")+'</p><div class="price">'+fmtBRL(p.price)+'</div></div><div class="add-col">'+addCol+'</div></div>';
}
function noticeBanner(){
  return '<div class="notice">⚠️ Configure sua chave Pix e o número de WhatsApp no <button onclick="openAdmin()">Painel da loja</button> antes de divulgar o cardápio.</div>';
}
function menuView(){
  var filterCat = state.activeCategory;
  var groups = {}; var order = [];
  state.products.forEach(function(p){
    if(filterCat !== "Todos" && p.category !== filterCat) return;
    if(!groups[p.category]){ groups[p.category] = []; order.push(p.category); }
    groups[p.category].push(p);
  });
  var html = '<div class="menu">';
  if(isDefaultConfig()) html += noticeBanner();
  if(order.length === 0){
    html += '<p style="text-align:center;color:var(--cocoa);opacity:.6;padding:40px 0;">Nenhum produto nessa categoria ainda.</p>';
  }
  order.forEach(function(cat){
    html += '<h2 class="category-title">'+escapeHTML(cat)+'</h2>';
    groups[cat].forEach(function(p){ html += productRow(p); });
  });
  html += '<div class="footer-link">Loja parceira? <button onclick="openAdmin()">Acessar painel administrativo</button></div>';
  html += '</div>';
  return html;
}
function cartBarView(){
  var n = cartCount();
  if(n === 0) return "";
  return '<div class="cart-bar" onclick="openSheet()"><span class="count">'+n+' '+(n===1?"item":"itens")+' · '+fmtBRL(cartSubtotal())+'</span><span class="go">Ver sacola</span></div>';
}
function checkoutContent(){
  var itemsHtml = cartItems().map(function(i){
    return '<div class="cart-item"><div class="ci-info"><strong>'+escapeHTML(i.name)+'</strong><span>'+fmtBRL(i.price)+' cada</span></div>' +
      '<div class="stepper"><button onclick="addToCart(\''+i.id+'\',-1)">–</button><span>'+i.qty+'</span><button onclick="addToCart(\''+i.id+'\',1)">+</button></div></div>';
  }).join("");

  var deliveryHtml = '<div class="delivery-options">' +
    '<div class="delivery-opt '+(state.deliveryType==="retirada"?"active":"")+'" onclick="setDeliveryType(\'retirada\')">🏠 Retirada no local</div>' +
    '<div class="delivery-opt '+(state.deliveryType==="entrega"?"active":"")+'" onclick="setDeliveryType(\'entrega\')">🛵 Entrega</div></div>';

  var addressHtml = "";
  if(state.deliveryType === "entrega"){
    addressHtml =
      '<div class="field"><label>Rua e número</label><input type="text" value="'+escapeHTML(state.address.street)+'" oninput="state.address.street=this.value" placeholder="Ex: Rua das Flores, 123"></div>' +
      '<div class="field"><label>Bairro</label><input type="text" value="'+escapeHTML(state.address.neighborhood)+'" oninput="state.address.neighborhood=this.value" placeholder="Ex: Centro"></div>' +
      '<div class="field"><label>Complemento / referência (opcional)</label><input type="text" value="'+escapeHTML(state.address.complement)+'" oninput="state.address.complement=this.value" placeholder="Ex: apto 12, perto do mercado"></div>' +
      '<p class="fee-note">Taxa de entrega: <strong>'+fmtBRL(state.settings.deliveryFee)+'</strong></p>';
  }

  var customerHtml =
    '<div class="field"><label>Seu nome</label><input type="text" value="'+escapeHTML(state.customer.name)+'" oninput="state.customer.name=this.value" placeholder="Nome completo"></div>' +
    '<div class="field"><label>Telefone (com DDD)</label><input type="tel" value="'+escapeHTML(state.customer.phone)+'" oninput="state.customer.phone=this.value" placeholder="(11) 99999-9999"></div>';

  var deliveryFeeVal = state.deliveryType === "entrega" ? Number(state.settings.deliveryFee||0) : 0;
  var totalsHtml = '<div class="totals"><div class="row"><span>Subtotal</span><span>'+fmtBRL(cartSubtotal())+'</span></div>' +
    (state.deliveryType==="entrega" ? '<div class="row"><span>Taxa de entrega</span><span>'+fmtBRL(deliveryFeeVal)+'</span></div>' : '') +
    '<div class="row total"><span>Total</span><span>'+fmtBRL(cartSubtotal()+deliveryFeeVal)+'</span></div></div>';

  var errorHtml = state.checkoutError ? '<p class="error-msg">'+escapeHTML(state.checkoutError)+'</p>' : "";

  return '<div class="sheet-header"><h2>Sua sacola</h2><button class="close-x" onclick="closeSheet()">✕</button></div>' +
    '<div class="step-label">1 · Itens</div>' + itemsHtml +
    '<div class="step-label">2 · Entrega</div>' + deliveryHtml + addressHtml +
    '<div class="step-label">3 · Seus dados</div>' + customerHtml +
    totalsHtml + errorHtml +
    '<button class="btn-primary" onclick="finalizeOrder()">Finalizar pedido e gerar Pix</button>';
}
function confirmationContent(){
  var o = state.confirmation;
  var n = o.items.reduce(function(s,i){ return s+i.qty; }, 0);
  var totalsHtml = '<div class="totals"><div class="row"><span>Itens</span><span>'+n+' '+(n===1?"item":"itens")+'</span></div>' +
    (o.deliveryFee > 0 ? '<div class="row"><span>Taxa de entrega</span><span>'+fmtBRL(o.deliveryFee)+'</span></div>' : '') +
    '<div class="row total"><span>Total a pagar</span><span>'+fmtBRL(o.total)+'</span></div></div>';
  var pixBlock = o.pixPayload
    ? '<div class="pix-code">'+escapeHTML(o.pixPayload)+'</div><button class="btn-secondary" onclick="copyPixCode()">Copiar código Pix</button>'
    : '<p class="error-msg">A loja ainda não configurou a chave Pix. Combine o pagamento diretamente pelo WhatsApp.</p>';
  return '<div class="sheet-header"><h2>Pedido pronto! 🎉</h2><button class="close-x" onclick="closeSheet()">✕</button></div>' +
    '<p class="sheet-note">Escaneie o QR Code no app do seu banco para pagar via Pix. Depois, toque em "Chamar no WhatsApp" para confirmar o pedido com a loja.</p>' +
    totalsHtml +
    '<div class="qr-box" id="qrcode-box"></div>' +
    pixBlock +
    '<a class="btn-whatsapp" href="'+whatsappUrl(o)+'" target="_blank" rel="noopener noreferrer">📲 Chamar no WhatsApp</a>' +
    '<button class="btn-secondary" onclick="newOrder()">Fazer novo pedido</button>';
}
function sheetView(){
  if(!state.sheetOpen) return "";
  var body = state.confirmation ? confirmationContent() : checkoutContent();
  return '<div class="overlay" onclick="if(event.target===this) closeSheet()"><div class="sheet" onclick="event.stopPropagation()">'+body+'</div></div>';
}
function pinModalView(){
  if(!state.pinModalOpen) return "";
  return '<div class="overlay overlay-center" onclick="if(event.target===this) closePinModal()">' +
    '<div class="pin-card" onclick="event.stopPropagation()">' +
    '<h3>Painel da loja</h3><p>Digite o PIN de acesso</p>' +
    '<input type="password" inputmode="numeric" maxlength="8" value="'+escapeHTML(state.pinInput)+'" oninput="state.pinInput=this.value" onkeydown="if(event.key===\'Enter\') submitPin()">' +
    (state.pinError ? '<p class="error-msg">'+escapeHTML(state.pinError)+'</p>' : '') +
    '<button class="btn-primary" onclick="submitPin()">Entrar</button>' +
    '<button class="btn-secondary" onclick="closePinModal()">Cancelar</button>' +
    '</div></div>';
}
function toastView(){
  if(!state.toastMsg) return "";
  return '<div class="toast">'+escapeHTML(state.toastMsg)+'</div>';
}
function adminView(){
  var s = state.adminDraft.settings;
  var prods = state.adminDraft.products;
  var html = '<div class="admin-header"><button class="back-link" onclick="exitAdmin()">← Voltar ao cardápio</button><h2>Painel da loja</h2></div>';

  html += '<div class="admin-section"><h3>Dados da loja</h3>' +
    '<div class="field"><label>Nome da loja</label><input type="text" value="'+escapeHTML(s.storeName)+'" oninput="state.adminDraft.settings.storeName=this.value"></div>' +
    '<div class="field"><label>Frase / assinatura</label><input type="text" value="'+escapeHTML(s.tagline)+'" oninput="state.adminDraft.settings.tagline=this.value"></div>' +
    '<div class="field"><label>WhatsApp para receber pedidos</label><input type="text" value="'+escapeHTML(s.whatsappNumber)+'" oninput="state.adminDraft.settings.whatsappNumber=this.value" placeholder="5511999999999"></div>' +
    '<p class="field-hint">Formato: código do país + DDD + número, só números (ex: 55 11 99999-9999 → 5511999999999).</p>' +
    '<div class="field"><label>Taxa de entrega (R$)</label><input type="number" step="0.01" min="0" value="'+s.deliveryFee+'" oninput="state.adminDraft.settings.deliveryFee=parseFloat(this.value)||0"></div>' +
    '<div class="field"><label>PIN de acesso a este painel</label><input type="text" maxlength="8" value="'+escapeHTML(s.adminPin)+'" oninput="state.adminDraft.settings.adminPin=this.value"></div>' +
    '<p class="field-hint">Esse código protege o acesso ao painel neste link.</p>' +
    '</div>';

  html += '<div class="admin-section"><h3>Recebimento via Pix</h3>' +
    '<div class="field"><label>Chave Pix</label><input type="text" value="'+escapeHTML(s.pixKey)+'" oninput="state.adminDraft.settings.pixKey=this.value" placeholder="CPF, CNPJ, e-mail, telefone ou chave aleatória"></div>' +
    '<div class="field"><label>Nome do recebedor (até 25 caracteres)</label><input type="text" maxlength="25" value="'+escapeHTML(s.merchantName)+'" oninput="state.adminDraft.settings.merchantName=this.value"></div>' +
    '<div class="field"><label>Cidade do recebedor (até 15 caracteres)</label><input type="text" maxlength="15" value="'+escapeHTML(s.merchantCity)+'" oninput="state.adminDraft.settings.merchantCity=this.value"></div>' +
    '<p class="field-hint">Use os mesmos dados cadastrados na sua conta Pix, para o QR Code funcionar corretamente.</p>' +
    '</div>';

  html += '<div class="admin-section"><h3>Produtos do cardápio</h3>';
  prods.forEach(function(p, i){
    html += '<div class="admin-product-row">' +
      '<button class="remove" onclick="removeAdminProduct('+i+')">Remover</button>' +
      '<div class="field"><label>Categoria</label><input type="text" value="'+escapeHTML(p.category)+'" oninput="state.adminDraft.products['+i+'].category=this.value" placeholder="Ex: Copos de Doce"></div>' +
      '<div class="field"><label>Nome</label><input type="text" value="'+escapeHTML(p.name)+'" oninput="state.adminDraft.products['+i+'].name=this.value"></div>' +
      '<div class="field"><label>Preço (R$)</label><input type="number" step="0.01" min="0" value="'+p.price+'" oninput="state.adminDraft.products['+i+'].price=parseFloat(this.value)||0"></div>' +
      '<div class="field"><label>Descrição</label><input type="text" value="'+escapeHTML(p.desc)+'" oninput="state.adminDraft.products['+i+'].desc=this.value"></div>' +
      '<div class="field"><label>URL da foto (opcional)</label><input type="text" value="'+escapeHTML(p.img)+'" oninput="state.adminDraft.products['+i+'].img=this.value" placeholder="https://..."></div>' +
      '</div>';
  });
  html += '<button class="btn-secondary" onclick="addAdminProduct()">+ Adicionar produto</button></div>';

  html += '<button class="btn-primary" onclick="saveAdmin()">Salvar alterações</button>' +
    '<button class="btn-secondary" onclick="exitAdmin()">Cancelar</button>';

  return '<div class="admin">'+html+'</div>';
}

/* ---------- Render principal ---------- */
function render(){
  var html = "";
  if(state.view === "admin" && state.adminDraft){
    html = adminView();
  } else {
    html = headerView() + categoriesView() + menuView() + cartBarView();
  }
  html += sheetView();
  html += pinModalView();
  html += toastView();
  document.getElementById("root").innerHTML = html;
  if(state.sheetOpen && state.confirmation){ generateQR(state.confirmation.pixPayload); }
}

/* ---------- Inicialização ---------- */
async function init(){
  state.settings = await loadJSON("settings", DEFAULT_SETTINGS);
  state.products = await loadJSON("products", DEFAULT_PRODUCTS);
  render();
}
init();
</script>
